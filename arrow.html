<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>화살표 퍼즐</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 상단 네비게이션 -->
  <nav class="top-nav">
    <a href="index.html" class="home-btn">← 홈으로</a>
  </nav>

  <!-- 헤더 -->
  <header>
    <h1>화살표 퍼즐</h1>
    <p>막힌 화살표 없이 진행 방향으로 빠져나갈 수 있는 것부터 빼세요.</p>
  </header>

  <!-- 컨트롤 바 -->
  <div class="controls">
    <div class="difficulty-group">
      <button data-ar-diff="easy" class="active">쉬움 4×4</button>
      <button data-ar-diff="medium">보통 5×5</button>
      <button data-ar-diff="hard">어려움 6×6</button>
    </div>
    <button class="btn btn-primary" id="ar-btn-new">새 게임</button>
    <button class="btn" id="ar-btn-undo">↩ 취소</button>
  </div>

  <!-- 스탯 바 -->
  <div class="stats">
    <div class="stat-pill">
      <span class="icon">⏱</span>
      <span class="value" id="ar-timer-value">00:00</span>
    </div>
    <div class="stat-pill">
      <span class="icon">✓</span>
      <span class="value" id="ar-moves-value">0</span>
      <span style="color:var(--text-muted);font-size:0.78rem">제거</span>
    </div>
    <div class="stat-pill">
      <span class="icon">⬡</span>
      <span class="value" id="ar-remain-value">0</span>
      <span style="color:var(--text-muted);font-size:0.78rem">남음</span>
    </div>
    <button class="btn btn-icon" id="ar-btn-sound" title="소리 켜기/끄기">🔊</button>
  </div>

  <!-- 게임 영역 -->
  <div id="ar-game-area">
    <div id="ar-grid"></div>

    <!-- 시작 오버레이 -->
    <div id="ar-overlay">
      <div class="start-card">
        <div class="start-icon">🎯</div>
        <h2 id="ar-overlay-title">쉬움</h2>
        <p id="ar-overlay-desc">화살표를 순서에 맞게 빼세요!</p>
        <button class="btn btn-primary btn-start" id="ar-btn-start">시작하기</button>
      </div>
    </div>
  </div>

  <!-- 완성 배너 -->
  <div id="ar-banner">
    <h2>🎉 완성!</h2>
    <div class="result-row">
      <span>⏱ <strong id="ar-final-time">--:--</strong></span>
      <span>✓ 제거 <strong id="ar-final-moves">0</strong>개</span>
    </div>
    <button class="btn btn-primary" id="ar-btn-next">다음 퍼즐 →</button>
  </div>

  <!-- 로딩 오버레이 -->
  <div id="ar-loading" class="show">
    <div class="spinner"></div>
    <span>퍼즐 생성 중…</span>
  </div>

  <!-- 플레이 방법 -->
  <details class="how-to-play">
    <summary>플레이 방법</summary>
    <ul>
      <li>화살표를 클릭하면 가리키는 방향으로 빠져나갑니다.</li>
      <li>진행 방향에 다른 화살표가 있으면 제거할 수 없습니다.</li>
      <li>빛나는 화살표가 지금 제거 가능한 것들입니다.</li>
      <li>↩ 취소 버튼으로 마지막 동작을 되돌릴 수 있습니다.</li>
      <li>모든 화살표를 제거하면 성공!</li>
    </ul>
  </details>

  <!-- 스크립트 -->
  <script src="js/sound.js"></script>
  <script src="js/arrow-solver.js"></script>
  <script src="js/arrow-generator.js"></script>
  <script src="js/arrow-game.js"></script>

</body>
</html>
